ekf_filter_node:
  ros__parameters:
    frequency: 100.0
    two_d_mode: true
    publish_tf: true
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /imu/data
    imu0_remove_gravitational_acceleration: true
    
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  false]

    imu0_relative: false
    imu0_queue_size: 10

    odom0: /odometry/gps
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10

navsat_transform:
  ros__parameters:
    frequency: 100.0
    delay: 3.0
    magnetic_declination_radians: 0.15
    yaw_offset: 2.86
    zero_altitude: true
    wait_for_datum: false
    use_odometry_yaw: false
    broadcast_cartesian_transform: true
    publish_filtered_gps: true
    
    # [Jazzy 필수 추가 항목] 아래 4줄이 없으면 노드가 죽습니다.
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom